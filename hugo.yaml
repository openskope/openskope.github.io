baseURL: https://www.openskope.org/
title: SKOPE
locale: en-US
defaultContentLanguage: en
enableRobotsTXT: true
enableGitInfo: false
# Keep original WordPress routes through content front matter aliases.
disableKinds: [taxonomy, term]
params:
  description: Synthesizing Knowledge of Past Environments
  offlineSearch: true
  # Only the user guide is versioned; app releases use CalVer.
  version_menu: User Guide
  version_menu_pagelinks: false
  guide_latest_released: v2023.10
  versions:
    - name: Current user guide
      kind: latest
      url: /users-guide/
      guide_page: /users-guide
    - version: v2023.10
      url: /users-guide/v2023.10/
      guide_page: /guide-versions/v2023.10
      app_revision: b5f65844b6ac0c5cc38ddb7a5a4362802688f33f
      content_sha256: bfa6b8d82086e58e90fc7081cad9acad137e8947f2b02e34ecd4099671621f14
    - name: Staging preview
      version: next
      kind: next
      url: /users-guide/next/
      guide_page: /guide-versions/next
      base_release: v2026.11.1
      app_revision: bd11a160de7e6b0072bd98d6aa223be3cd9f1d26
      app_build: v2026.11.1-6-gbd11a16
      reviewed: 2026-11-25
  website_source: https://github.com/openskope/openskope.github.io
  ui:
    navbar_logo: false
    navbar_theme: light
    sidebar_menu_compact: true
    feedback:
      enable: false
    readingtime:
      enable: false
  links:
    user:
      - name: Contact the SKOPE team
        url: mailto:skope-team@googlegroups.com
        icon: fa fa-envelope
menu:
  main:
    - name: Use SKOPE
      pageRef: /use-skope
      weight: 10
    - name: Data & tools
      pageRef: /data-tools
      weight: 20
    - name: Research
      pageRef: /research
      weight: 30
    - name: About
      pageRef: /about
      weight: 40
    - name: Launch SKOPE
      identifier: launch-skope
      url: https://app.openskope.org
      weight: 50
markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
  goldmark:
    renderer:
      unsafe: true
module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: data
      target: data
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: static/wp-content/uploads
      target: assets/legacy-images
  hugoVersion:
    min: 0.170.1
  imports:
    - path: github.com/docsy/docsy/theme
# Use default content/static mounts; custom mounts must retain static -> static.
