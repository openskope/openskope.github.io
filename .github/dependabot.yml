version: 2
# Routine checks: Monday and Friday at 09:00 Arizona time.
# Security alerts and security-update PRs run independently of this schedule.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 1,5"
      timezone: "America/Phoenix"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 1,5"
      timezone: "America/Phoenix"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 1,5"
      timezone: "America/Phoenix"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 1,5"
      timezone: "America/Phoenix"
