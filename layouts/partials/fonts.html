{{/* Content fingerprints keep preload and CSS URLs synchronized on root/subpaths. */}}
{{ range hugo.Data.fonts.faces }}
  {{ $font := resources.Get .asset | resources.Fingerprint "sha256" }}
  {{ if .preload }}<link rel="preload" href="{{ $font.RelPermalink }}" as="font" type="font/woff2" crossorigin>{{ end }}
{{ end }}
<style>
{{ range hugo.Data.fonts.faces }}
  {{ $font := resources.Get .asset | resources.Fingerprint "sha256" }}
@font-face {
  font-family: "{{ .family }}";
  font-style: {{ .style | safeCSS }};
  font-weight: {{ .weight | safeCSS }};
  font-display: swap;
  src: url("{{ $font.RelPermalink }}") format("woff2");
  unicode-range: {{ .unicode_range | safeCSS }};
}
{{ end }}
</style>
