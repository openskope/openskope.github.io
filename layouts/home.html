{{ define "main" }}
<main id="td-main-content" class="container skope-home">
  <div class="skope-home-heading">
    <h1>{{ .Title }}</h1>
    <div class="skope-actions">
      <a class="btn btn-primary" href="https://app.openskope.org">Launch SKOPE</a>
      <a class="btn btn-outline-primary" href="{{ relref . "/users-guide" }}">Read the guide</a>
    </div>
  </div>
  <div class="td-content">{{ .Content }}</div>
  <nav class="skope-explore" aria-label="Explore SKOPE">
    <h2>Explore SKOPE</h2>
    <ul>
    {{ range .Site.Menus.main }}
      {{ with .Page }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}
    {{ end }}
    </ul>
  </nav>
</main>
{{ end }}
