{{ define "main" }}
<div tabindex="-1" id="td-main-content" class="container skope-home">
  <div class="skope-home-heading">
    <h1>{{ .Title }}</h1>
    {{ partial "skope/actions.html" (dict "page" .) }}
  </div>
  <div class="td-content">{{ .Content }}</div>
  <nav class="skope-explore" aria-label="Explore SKOPE">
    <h2>Explore SKOPE</h2>
    <ul>
    {{ range .Site.Menus.main }}
      {{ with .Page }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}
    {{ end }}
    </ul>
  </nav>
</div>
{{ end }}
